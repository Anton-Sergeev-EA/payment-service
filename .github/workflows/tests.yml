name: Tests

# Раньше в проекте не было CI вообще — при том что тестовый набор
# (tests/) реально ловит проблемы (см. CHANGES.md: 18 из 25 тестов
# падали из-за бага с `FOR UPDATE` на SQLite, но это никто не заметил,
# потому что тесты просто никогда не запускались автоматически).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Позволяет тестам создавать БД в рабочей директории раннера,
          # не требуя доступа на запись в /data (см. CHANGES.md —
          # раньше путь к БД был жёстко зашит и не переопределялся).
          DATABASE_PATH: ${{ github.workspace }}/testdata/test.db
        run: |
          mkdir -p testdata
          pytest tests/ -v --cov=src --cov-report=term-missing

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t payment-service:ci .
